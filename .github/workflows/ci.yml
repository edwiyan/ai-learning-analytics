name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ailas_user
          POSTGRES_PASSWORD: ailas_pass
          POSTGRES_DB: ailas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run migrations
        env:
          DATABASE_URL: postgresql://ailas_user:ailas_pass@localhost:5432/ailas_test
        run: python -m alembic upgrade head

      - name: Run tests
        env:
          DATABASE_URL: postgresql://ailas_user:ailas_pass@localhost:5432/ailas_test
          SECRET_KEY: ci-test-secret-key-not-for-production
          OPENAI_API_KEY: sk-test-placeholder
        run: pytest backend/tests/ -v --tb=short

  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check backend/ --select=E,F,W --ignore=E501

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: ""
